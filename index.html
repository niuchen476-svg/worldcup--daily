<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2026 FIFA World Cup · 每日晨报</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00C853;--gold:#FFD700;--glow:#00FF7F;--red:#FF3D3D;
  --bg:#0A0F0A;--card:#111A11;--card2:#162016;--border:#1B3A1B;
  --text1:#E8F5E9;--text2:#81C784;--text3:#4CAF50;
  --nav-bg:rgba(10,15,10,.85);
}
[data-theme="light"]{
  --bg:#F5F5F5;--card:#FFFFFF;--card2:#F0F7F0;--border:#C8E6C9;
  --text1:#1B3A1B;--text2:#2E7D32;--text3:#388E3C;
  --nav-bg:rgba(245,245,245,.92);
}
html,body{height:100%;background:var(--bg);color:var(--text1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
  overflow-x:hidden;transition:background .3s,color .3s}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:80px;
  background-image:repeating-linear-gradient(-45deg,rgba(0,200,83,.018) 0,rgba(0,200,83,.018) 1px,transparent 1px,transparent 52px)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--green);border-radius:4px}

/* ══ BANNER 280px ══ */
.banner{position:relative;overflow:hidden;height:280px;
  background:linear-gradient(160deg,#051205 0%,#0d260d 60%,#0a1a0a 100%)}
.banner-player{position:absolute;bottom:0;width:45%;height:100%;
  object-fit:cover;object-position:top center}
.banner-player.messi{left:0;
  -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,.9) 55%,transparent);
  mask-image:linear-gradient(to right,rgba(0,0,0,.9) 55%,transparent)}
.banner-player.cr7{right:0;
  -webkit-mask-image:linear-gradient(to left,rgba(0,0,0,.9) 55%,transparent);
  mask-image:linear-gradient(to left,rgba(0,0,0,.9) 55%,transparent)}
.banner-overlay{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(10,15,10,.8) 100%)}
.banner-pitch{position:absolute;inset:0;opacity:.15;pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg,rgba(0,200,83,.1) 0,rgba(0,200,83,.1) 1px,transparent 1px,transparent 40px),
    repeating-linear-gradient(0deg,rgba(0,200,83,.07) 0,rgba(0,200,83,.07) 1px,transparent 1px,transparent 60px)}
.banner-glow{position:absolute;top:0;left:-100%;width:300%;height:3px;
  background:linear-gradient(90deg,transparent,var(--glow),var(--gold),var(--glow),transparent);
  animation:glowSweep 4s linear infinite}
@keyframes glowSweep{0%{left:-100%}100%{left:100%}}
.banner-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:2;gap:6px;pointer-events:none}
.banner-trophy{width:72px;height:72px;filter:drop-shadow(0 0 20px rgba(255,215,0,.7));
  margin-bottom:2px}
.banner-title{font-size:21px;font-weight:900;color:#fff;letter-spacing:.5px;
  text-shadow:0 2px 16px rgba(0,0,0,.9)}
.banner-subtitle{font-size:11px;color:var(--gold);letter-spacing:2.5px;
  text-shadow:0 0 10px rgba(255,215,0,.5)}
.banner-top-right{position:absolute;top:12px;right:12px;z-index:10;
  display:flex;align-items:center;gap:6px}
.live-dot-wrap{display:flex;align-items:center;gap:5px;
  background:rgba(255,61,61,.15);border:1px solid rgba(255,61,61,.35);
  border-radius:20px;padding:4px 10px;font-size:11px;color:var(--red);font-weight:700}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);
  animation:livePulse 1.4s ease-in-out infinite}
@keyframes livePulse{
  0%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(255,61,61,.8)}
  60%{opacity:.8;transform:scale(1.3);box-shadow:0 0 0 6px rgba(255,61,61,0)}
  100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(255,61,61,0)}}
.date-pill{font-size:11px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px 8px;backdrop-filter:blur(4px)}
.theme-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.4);backdrop-filter:blur(6px);cursor:pointer;
  font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .3s;color:#fff}
.theme-btn:hover{background:rgba(255,255,255,.15)}

/* update bar */
.update-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:8px;transition:background .3s}
.upd-item{flex:1;text-align:center}
.upd-label{font-size:9px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
.upd-track{height:3px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.upd-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--gold));
  animation:fillPulse 3s ease-in-out infinite alternate}
@keyframes fillPulse{0%{opacity:.6}100%{opacity:1}}

.nav-tabs{display:none}
.page{display:none;padding:12px 12px 8px}
.page.active{display:block;animation:slideIn .3s cubic-bezier(.25,.46,.45,.94) both}
@keyframes slideIn{0%{opacity:0;transform:translateX(28px)}100%{opacity:1;transform:translateX(0)}}
.stagger-item{opacity:0;transform:translateY(20px);animation:staggerUp .4s ease forwards}
@keyframes staggerUp{to{opacity:1;transform:translateY(0)}}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:14px;font-weight:800;color:var(--text1);display:flex;align-items:center;gap:6px}
.sec-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.5px}
.badge-green{background:rgba(0,200,83,.15);color:var(--glow);border:1px solid rgba(0,200,83,.25)}
.badge-gold{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.2)}
.badge-red{background:rgba(255,61,61,.12);color:#ff8080;border:1px solid rgba(255,61,61,.2)}

/* ══ MATCH CARD ══ */
.match-card{border-radius:14px;padding:14px 12px;margin-bottom:10px;
  position:relative;overflow:hidden;cursor:pointer;
  border:1px solid rgba(0,200,83,.35);box-shadow:0 0 18px rgba(0,200,83,.1);
  transition:transform .2s,box-shadow .2s}
.match-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,200,83,.22)}
.match-bg-home,.match-bg-away{position:absolute;top:0;width:52%;height:100%;
  object-fit:cover;opacity:.14;filter:blur(10px) saturate(1.6)}
.match-bg-home{left:0}
.match-bg-away{right:0}
.match-bg-overlay{position:absolute;inset:0;
  background:linear-gradient(to right,rgba(10,15,10,.7) 0%,rgba(10,15,10,.55) 50%,rgba(10,15,10,.7) 100%)}
[data-theme="light"] .match-bg-overlay{background:linear-gradient(to right,rgba(245,245,245,.78) 0%,rgba(245,245,245,.62) 50%,rgba(245,245,245,.78) 100%)}
.match-card-inner{position:relative;z-index:1}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.team-block{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.team-flag{width:40px;height:40px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(255,255,255,.25);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.team-flag-fallback{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);
  background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px}
.team-name{font-size:13px;font-weight:700;color:var(--text1);text-align:center}
.team-form{display:flex;gap:3px;justify-content:center}
.form-dot{width:6px;height:6px;border-radius:50%}
.form-dot.W{background:#00C853}.form-dot.D{background:#FFD700}.form-dot.L{background:#FF3D3D}.form-dot.u{background:rgba(255,255,255,.18)}
.vs-block{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:80px}
.status-tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;
  padding:3px 8px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.status-upcoming{background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}
.status-live{background:rgba(255,61,61,.15);color:var(--red);border:1px solid rgba(255,61,61,.3);
  animation:liveFlash 1.5s ease-in-out infinite}
.status-live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:livePulse 1.4s ease-in-out infinite}
@keyframes liveFlash{0%,100%{opacity:1}50%{opacity:.65}}
.status-ft{background:rgba(255,255,255,.08);color:var(--text1);border:1px solid rgba(255,255,255,.15)}
.match-time{font-size:14px;font-weight:700;color:var(--glow);letter-spacing:.5px;
  text-shadow:0 0 10px rgba(0,255,127,.6)}
.vs-text{font-size:20px;font-weight:900;color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,.5)}
.match-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px}
.match-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.group-tag{font-size:10px;padding:2px 7px;border-radius:4px;
  background:rgba(0,200,83,.1);color:var(--green);border:1px solid rgba(0,200,83,.2);font-weight:600}
.venue-tag{font-size:10px;color:var(--text3)}
.predict-count{font-size:10px;color:var(--text3)}

.result-card{background:var(--card);border:1px solid rgba(0,200,83,.3);border-radius:14px;
  padding:14px 12px;margin-bottom:10px;position:relative;overflow:hidden;
  box-shadow:0 0 16px rgba(0,200,83,.08);transition:transform .2s,box-shadow .2s}
.result-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,200,83,.14)}
.result-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.result-score{font-size:32px;font-weight:900;letter-spacing:4px;
  background:linear-gradient(90deg,var(--green),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.result-team-name{font-size:13px;font-weight:700;color:var(--text1);text-align:center;flex:1}
.result-meta{border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
.scorer-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.scorer-tag{display:inline-flex;align-items:center;gap:3px;
  background:rgba(0,200,83,.1);border:1px solid rgba(0,200,83,.2);
  border-radius:4px;padding:2px 7px;font-size:11px;color:var(--glow)}
.summary-text{font-size:11px;color:var(--text2);line-height:1.6}

.sent-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 12px 12px 16px;margin-bottom:10px;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.sent-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
.sent-card.pos::before{background:linear-gradient(180deg,var(--green),var(--glow));box-shadow:0 0 10px rgba(0,255,127,.5)}
.sent-card.neg::before{background:linear-gradient(180deg,var(--red),#ff6b6b);box-shadow:0 0 10px rgba(255,61,61,.5)}
.sent-card.neu::before{background:var(--text3)}
.sent-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.sent-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.sent-title{font-size:13px;font-weight:600;color:var(--text1);flex:1;line-height:1.4}
.sent-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;letter-spacing:.5px;flex-shrink:0}
.sent-pos-b{background:rgba(0,200,83,.15);color:var(--glow);border:1px solid rgba(0,200,83,.3);
  box-shadow:0 0 6px rgba(0,255,127,.25);text-shadow:0 0 4px rgba(0,255,127,.4)}
.sent-neg-b{background:rgba(255,61,61,.15);color:#ff8080;border:1px solid rgba(255,61,61,.3)}
.sent-neu-b{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}
.sent-summary{font-size:11px;color:var(--text2);line-height:1.55;margin-bottom:8px}
.sent-source-row{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text3)}
.heat-wrap{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.heat-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--gold))}

.ai-card{background:var(--card);border:1px solid rgba(0,200,83,.25);border-radius:14px;
  padding:16px;position:relative;overflow:hidden}
.ai-neural-bg{position:absolute;inset:0;pointer-events:none;opacity:.35}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative}
.ai-icon-wrap{width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--green),#006430);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 22px rgba(0,200,83,.55)}
.ai-meta{flex:1}
.ai-label-txt{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.ai-model-txt{font-size:13px;font-weight:700;color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,.35)}
.ai-body{font-size:13px;color:var(--text2);line-height:1.8;position:relative}
.typewriter::after{content:'|';color:var(--glow);animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.fb-particle{position:fixed;pointer-events:none;z-index:0;font-size:24px;opacity:0;animation:fbFloat linear infinite}
@keyframes fbFloat{
  0%{opacity:0;transform:translate(0,100vh) rotate(0deg)}
  10%{opacity:.12}90%{opacity:.08}
  100%{opacity:0;transform:translate(55vw,-20vh) rotate(720deg)}}

/* ══ BOTTOM NAV 5 items ══ */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:2px solid var(--green);box-shadow:0 -4px 24px rgba(0,200,83,.14);
  display:flex;align-items:flex-end;z-index:100;transition:background .3s;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 4px 10px;cursor:pointer;font-size:9px;font-weight:600;
  color:var(--text3);letter-spacing:.5px;border:none;background:transparent;
  transition:color .2s;gap:3px}
.nav-item:active{transform:scale(.9)}
.nav-item.active{color:var(--green)}
.nav-item .nav-icon{font-size:20px;line-height:1;transition:transform .2s,filter .2s}
.nav-item.active .nav-icon{
  filter:drop-shadow(0 0 8px var(--green)) drop-shadow(0 0 14px rgba(0,255,127,.35));
  transform:scale(1.15)}
.nav-center{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding-bottom:6px;cursor:pointer;border:none;background:transparent}
.nav-plus{width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;font-weight:900;line-height:1;
  box-shadow:0 4px 20px rgba(0,200,83,.5),0 0 0 4px rgba(0,200,83,.12);
  transform:translateY(-8px);transition:transform .2s,box-shadow .2s}
.nav-center:active .nav-plus{transform:translateY(-8px) scale(.9)}
.nav-center:hover .nav-plus{transform:translateY(-11px);box-shadow:0 8px 28px rgba(0,200,83,.6)}
.nav-center-label{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.5px;margin-top:-2px}

.lb-toggle{display:flex;gap:8px;margin-bottom:12px}
.lb-toggle-btn{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;
  border:1px solid var(--border);background:var(--card);color:var(--text3);cursor:pointer;transition:all .2s}
.lb-toggle-btn.active{background:rgba(0,200,83,.12);color:var(--green);
  border-color:rgba(0,200,83,.3);box-shadow:0 0 10px rgba(0,200,83,.15)}
.lb-row{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:border-color .2s}
.lb-row:hover{border-color:rgba(0,200,83,.3)}
.lb-row.me{border-color:rgba(0,200,83,.4);background:rgba(0,200,83,.06);box-shadow:0 0 12px rgba(0,200,83,.15)}
.lb-rank{width:28px;text-align:center;font-size:14px;font-weight:900;color:var(--text3)}
.lb-rank.gold{color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,.4)}
.lb-rank.silver{color:#C0C0C0}.lb-rank.bronze{color:#CD7F32}
.lb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--green),#006430);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.lb-info{flex:1}
.lb-name{font-size:13px;font-weight:600;color:var(--text1)}
.lb-acc{font-size:10px;color:var(--text3)}
.lb-coins{font-size:13px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:3px;
  text-shadow:0 0 8px rgba(255,215,0,.4)}
.lb-me-bar{position:sticky;bottom:80px;background:rgba(0,200,83,.1);
  border:1px solid rgba(0,200,83,.3);border-radius:10px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;margin-top:4px}

.profile-unauth{display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:16px}
.profile-unauth h2{font-size:20px;font-weight:800;color:var(--text1)}
.profile-unauth p{font-size:13px;color:var(--text3);text-align:center}
.auth-btns{display:flex;gap:10px;margin-top:4px}
.btn-primary{padding:10px 28px;border-radius:24px;font-size:14px;font-weight:700;
  background:linear-gradient(90deg,var(--green),#00a843);color:#fff;border:none;cursor:pointer;
  transition:transform .15s,box-shadow .15s}
.btn-primary:active{transform:scale(.95)}
.btn-primary:hover{transform:scale(1.04);box-shadow:0 0 16px rgba(0,200,83,.4)}
.btn-secondary{padding:10px 28px;border-radius:24px;font-size:14px;font-weight:700;
  background:transparent;color:var(--green);border:1px solid rgba(0,200,83,.4);cursor:pointer;transition:all .2s}
.btn-secondary:hover{background:rgba(0,200,83,.08)}
.profile-auth{padding:4px 0}
.profile-header{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;
  box-shadow:0 0 18px rgba(0,200,83,.08)}
.prof-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--green),#006430);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;
  color:#fff;flex-shrink:0;box-shadow:0 0 16px rgba(0,200,83,.4)}
.prof-info{flex:1}
.prof-name{font-size:16px;font-weight:800;color:var(--text1);margin-bottom:3px}
.prof-coins{font-size:14px;color:var(--gold);display:flex;align-items:center;gap:5px;
  font-weight:700;text-shadow:0 0 8px rgba(255,215,0,.35)}
.prof-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.prof-card-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.checkin-btn{width:100%;padding:10px;border-radius:10px;font-size:14px;font-weight:700;
  background:linear-gradient(90deg,var(--green),#00a843);color:#fff;border:none;cursor:pointer;transition:all .2s}
.checkin-btn:disabled{background:var(--card2);color:var(--text3);cursor:default;border:1px solid var(--border)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-item{background:var(--card2);border-radius:8px;padding:10px;text-align:center}
.stat-num{font-size:20px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;
  text-shadow:0 0 10px #00C853,0 0 20px rgba(0,200,83,.35)}
.stat-label{font-size:10px;color:var(--text3);margin-top:2px}
.hist-row{display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.hist-row:last-child{border-bottom:none}

<script>
const SUPA_URL='https://qsbjvukzyeazyzfonisa.supabase.co';
const SUPA_KEY='sb_publishable_w-HamEcsEFTRL2qbRla_ag_evqV0FrP';

/* ── theme ── */
(function(){
  const s=localStorage.getItem('wc_theme')||'dark';
  document.documentElement.setAttribute('data-theme',s);
  const b=document.getElementById('theme-toggle');
  if(b)b.textContent=s==='dark'?'🌙':'☀️';
})();
document.getElementById('theme-toggle').onclick=function(){
  const c=document.documentElement.getAttribute('data-theme');
  const n=c==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('wc_theme',n);
  this.textContent=n==='dark'?'🌙':'☀️';
};

/* ── supabase ── */
async function sbFetch(path,opts={}){
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json','Prefer':opts.prefer||'',...(opts.headers||{})},
    method:opts.method||'GET',body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){let e;try{e=await r.json();}catch(_){e={};}throw new Error(e.message||e.error||'HTTP '+r.status);}
  if(r.status===204)return null;return r.json();
}
const sbGet=p=>sbFetch(p);
const sbPost=(t,b)=>sbFetch(t,{method:'POST',body:b,prefer:'return=representation'});
const sbPatch=(p,b)=>sbFetch(p,{method:'PATCH',body:b,prefer:'return=representation'});

/* ── auth ── */
let currentUser=JSON.parse(localStorage.getItem('wc_user')||'null');
function saveUser(u){currentUser=u;localStorage.setItem('wc_user',JSON.stringify(u));}
function clearUser(){currentUser=null;localStorage.removeItem('wc_user');}
async function refreshUser(){
  if(!currentUser)return;
  try{const r=await sbGet('users?id=eq.'+currentUser.id+'&select=*');if(r&&r[0])saveUser(r[0]);}catch(_){}
}

/* ── toast ── */
let _tt;
function toast(msg,isErr){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show'+(isErr?' err':'');
  clearTimeout(_tt);_tt=setTimeout(()=>{el.className='toast';},2800);
}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function flagImg(code,cls){
  const c=(code||'').toUpperCase(),lc=c.toLowerCase();
  return '<img class="'+cls+'" src="https://flagcdn.com/w80/'+lc+'.png" '
    +'onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\''+cls+' team-flag-fallback\',textContent:emojiFlag(\''+c+'\')}))" alt="'+c+'">';
}
function emojiFlag(code){
  return [...(code||'').toUpperCase()].map(c=>String.fromCodePoint(c.charCodeAt(0)+127397)).join('');
}
function fmtDate(ds){
  const[y,m,d]=ds.split('-'),dt=new Date(ds+'T12:00:00+08:00');
  const days=['日','一','二','三','四','五','六'];
  return y+'年'+m+'月'+d+'日 星期'+days[dt.getDay()];
}
function matchStatus(timeStr,dateStr){
  const[h,mn]=timeStr.split(':').map(Number);
  const target=new Date(dateStr+'T'+String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0')+':00+08:00');
  const diff=target-Date.now();
  if(diff>0){
    const hh=Math.floor(diff/3600000),mm=Math.floor((diff%3600000)/60000);
    return '<span class="status-tag status-upcoming">未开赛 · '+(hh>24?Math.floor(hh/24)+'天后':hh+'h'+mm+'m后')+'</span>';
  }
  if(Date.now()-target<110*60000)
    return '<span class="status-tag status-live"><span class="status-live-dot"></span>LIVE</span>';
  return '<span class="status-tag status-ft">FT</span>';
}
function formDots(){
  return ['W','W','W','D','L','D','W','L'].sort(()=>Math.random()-.5).slice(0,5)
    .map(r=>'<span class="form-dot '+r+'"></span>').join('');
}

/* ── tabs ── */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(p=>{
    const on=p.id==='page-'+tab;
    p.classList.toggle('active',on);
  });
  document.querySelectorAll('.nav-item[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===tab));
  if(tab==='rank')loadRank();
  if(tab==='profile')renderProfile();
}
document.querySelectorAll('.nav-item[data-nav]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.nav)));
document.getElementById('nav-plus-btn').addEventListener('click',()=>switchTab('predict'));

/* ── modals ── */
function openModal(id){document.getElementById(id).classList.add('open');}

/* ── register ── */
async function hashPassword(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
document.getElementById('reg-submit').onclick=async function(){
  const btn=this,un=document.getElementById('reg-username').value.trim(),
    em=document.getElementById('reg-email').value.trim(),
    pw=document.getElementById('reg-password').value,
    msg=document.getElementById('reg-msg');
  msg.textContent='';
  if(!un||!em||!pw){msg.className='form-msg err';msg.textContent='请填写所有字段';return;}
  if(pw.length<6){msg.className='form-msg err';msg.textContent='密码至少6位';return;}
  btn.disabled=true;btn.textContent='注册中…';
  try{
    const hash=await hashPassword(pw);
    const rows=await sbPost('users',{username:un,email:em,password_hash:hash,virtual_coins:1000});
    if(rows&&rows[0]){saveUser(rows[0]);msg.className='form-msg ok';msg.textContent='注册成功！已送1000虚拟币 🎉';
      setTimeout(()=>{closeModal('modal-register');renderProfile();toast('🎉 注册成功，欢迎 '+un);},1200);}
  }catch(e){msg.className='form-msg err';msg.textContent=e.message.includes('unique')?'用户名或邮箱已被注册':e.message;}
  finally{btn.disabled=false;btn.textContent='注册并获得 1000 虚拟币 🪙';}
};

/* ── login ── */
document.getElementById('login-submit').onclick=async function(){
  const btn=this,em=document.getElementById('login-email').value.trim(),
    pw=document.getElementById('login-password').value,
    msg=document.getElementById('login-msg');

  btn.disabled=true;btn.textContent='登录中…';
  try{
    const hash=await hashPassword(pw);
    const rows=await sbGet('users?email=eq.'+encodeURIComponent(em)+'&password_hash=eq.'+hash+'&select=*');
    if(!rows||!rows[0])throw new Error('邮箱或密码错误');
    saveUser(rows[0]);
    await sbPatch('users?id=eq.'+rows[0].id,{last_sign_in:new Date().toISOString()});

    setTimeout(()=>{closeModal('modal-login');renderProfile();toast('👋 欢迎回来，'+rows[0].username);},900);
  }catch(e){msg.className='form-msg err';msg.textContent=e.message;}

};

async function initCheckin(){
  const btn=document.getElementById('checkin-btn');if(!btn||!currentUser)return;
  const today=new Date().toISOString().slice(0,10);
  try{
    const rows=await sbGet('check_ins?user_id=eq.'+currentUser.id+'&check_in_date=eq.'+today);
    if(rows&&rows.length>0){btn.disabled=true;btn.textContent='✅ 今日已签到 (+50 已到账)';}
    else btn.onclick=async()=>{btn.disabled=true;
      try{
        await sbPost('check_ins',{user_id:currentUser.id,check_in_date:today,coins_earned:50});
        await sbPatch('users?id=eq.'+currentUser.id,{virtual_coins:(currentUser.virtual_coins||0)+50});
        currentUser.virtual_coins=(currentUser.virtual_coins||0)+50;saveUser(currentUser);
        btn.textContent='✅ 签到成功！+50 虚拟币';toast('🎁 签到成功，+50 虚拟币！');
        const pc=document.querySelector('.prof-coins');if(pc)pc.textContent='🪙 '+currentUser.virtual_coins.toLocaleString()+' 虚拟币';
      }catch(e){btn.disabled=false;toast('签到失败：'+e.message,true);}
    };
  }catch(_){}
}
async function loadStats(){
  if(!currentUser)return;
  try{
    const rows=await sbGet('predictions?user_id=eq.'+currentUser.id+'&select=result');
    const total=rows?rows.length:0,wins=rows?rows.filter(r=>r.result==='win').length:0,
      acc=total>0?Math.round(wins/total*100):0;
    const g=document.getElementById('stats-grid');
    if(g)g.innerHTML='<div class="stat-item"><div class="stat-num">'+total+'</div><div class="stat-label">总场次</div></div>'
      +'<div class="stat-item"><div class="stat-num">'+wins+'</div><div class="stat-label">胜场</div></div>'
      +'<div class="stat-item"><div class="stat-num">'+acc+'%</div><div class="stat-label">准确率</div></div>';
  }catch(_){}
}
async function loadHistory(){
  if(!currentUser)return;
  try{
    const rows=await sbGet('predictions?user_id=eq.'+currentUser.id+'&order=created_at.desc&limit=10&select=*');
    const el=document.getElementById('hist-list');if(!el)return;
    if(!rows||rows.length===0){el.innerHTML='<div style="font-size:12px;color:var(--text3);text-align:center;padding:12px">暂无竞猜记录</div>';return;}
    const opts={home:'主队赢',draw:'平局',away:'客队赢'};
    el.innerHTML=rows.map(r=>{
      const cls=r.result==='win'?'hist-win':r.result==='lose'?'hist-lose':'hist-pend';
      const label=r.result==='win'?'胜':r.result==='lose'?'负':'待定';
      const coins=r.result==='win'?'+'+r.coins_earned:r.result==='lose'?'-'+r.coins_bet:'';
      return '<div class="hist-row"><span class="hist-match">'+esc(r.match_id)+' · '+esc(opts[r.predicted_winner]||r.predicted_winner)+'</span>'
        +'<span class="hist-result '+cls+'">'+label+'</span><span class="hist-coins">'+coins+'</span></div>';
    }).join('');
  }catch(_){}
}

  try{

    else{
      if(!currentUser){el.innerHTML='<div class="predict-empty">登录后查看好友榜</div>';return;}
      const fs=await sbGet('friendships?or=(user_id.eq.'+currentUser.id+',friend_id.eq.'+currentUser.id+')&status=eq.accepted&select=user_id,friend_id');

      return '<div class="lb-row'+(isMe?' me':'')+'"><div class="lb-rank '+(rc[i]||'')+'">'+(i<3?medals[i]:i+1)+'</div>'
        +'<div class="lb-avatar">'+init+'</div><div class="lb-info"><div class="lb-name">'+esc(r.username)

        +'<div class="lb-coins">🪙'+(r.virtual_coins||0).toLocaleString()+'</div></div>';
    }).join('');
  }catch(e){el.innerHTML='<div class="predict-empty" style="color:var(--red)">加载失败：'+esc(e.message)+'</div>';}
}

document.getElementById('bet-confirm').onclick=async function(){
  const msg=document.getElementById('bet-msg');msg.textContent='';
  if(!currentUser){msg.className='form-msg err';msg.textContent='请先登录';openModal('modal-login');return;}
  if(!betChoice){msg.className='form-msg err';msg.textContent='请选择竞猜结果';return;}
  if(!betAmount){msg.className='form-msg err';msg.textContent='请选择下注金额';return;}
  if((currentUser.virtual_coins||0)<betAmount){msg.className='form-msg err';msg.textContent='虚拟币余额不足';return;}
  this.disabled=true;this.textContent='提交中…';
  try{
    const mid=betMatchData.home+'_'+betMatchData.away+'_'+betMatchData.time;
    await sbPost('predictions',{user_id:currentUser.id,match_id:mid,predicted_winner:betChoice,coins_bet:betAmount});
    await sbPatch('users?id=eq.'+currentUser.id,{virtual_coins:currentUser.virtual_coins-betAmount});
    currentUser.virtual_coins-=betAmount;saveUser(currentUser);
    msg.className='form-msg ok';msg.textContent='下注成功！祝你好运 🍀';
    toast('🎯 已下注 '+betAmount+' 虚拟币！');
    setTimeout(()=>closeModal('modal-bet'),1500);
  }catch(e){msg.className='form-msg err';msg.textContent='下注失败：'+e.message;}
  finally{this.disabled=false;this.textContent='确认下注';}
};

/* ── neural lines ── */
function neuralLines(){
  const pts=[[30,20],[80,50],[140,15],[200,60],[260,25],[290,55],[50,80],[110,95],[170,75],[230,90],[280,80]];
  const cx=[[0,1],[1,2],[2,3],[3,4],[4,5],[1,6],[2,7],[3,8],[4,9],[5,10],[6,7],[7,8],[8,9],[9,10]];
  return cx.map(([a,b])=>'<line x1="'+pts[a][0]+'" y1="'+pts[a][1]+'" x2="'+pts[b][0]+'" y2="'+pts[b][1]+'"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="'+(2+Math.random()*3).toFixed(1)+'s" repeatCount="indefinite"/></line>').join('')
    +pts.map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="2.5" fill="rgba(0,200,83,0.2)"><animate attributeName="r" values="2;3.5;2" dur="'+(1.5+Math.random()*2).toFixed(1)+'s" repeatCount="indefinite"/></circle>').join('');
}

/* ── typewriter ── */
function typeWriter(el,text,speed){
  el.textContent='';el.classList.add('typewriter');let i=0;
  const t=setInterval(()=>{if(i<text.length){el.textContent+=text[i++];}else{clearInterval(t);el.classList.remove('typewriter');}},speed);
}

    +'<rect x="44" y="80" width="12" height="18" rx="2" fill="url(#etg)"/>'
    +'<path d="M22 10 L26 76 Q50 88 74 76 L78 10 Z" fill="url(#etg)" opacity=".9"/>'
    +'<path d="M22 18 Q7 26 9 46 Q11 60 24 62" stroke="url(#etg)" stroke-width="5" fill="none" stroke-linecap="round"/>'
    +'<path d="M78 18 Q93 26 91 46 Q89 60 76 62" stroke="url(#etg)" stroke-width="5" fill="none" stroke-linecap="round"/>'
    +'<ellipse cx="40" cy="36" rx="5" ry="14" fill="rgba(255,255,255,0.28)" transform="rotate(-15 40 36)"/></svg>'
    +'<div class="empty-cd-label">距世界杯开幕还有</div>'
    +'<div class="empty-countdown" id="wc-countdown">'
    +'<div class="empty-cd-item"><div class="empty-cd-num" id="cd-days">--</div><div class="empty-cd-unit">天</div></div>'
    +'<div class="empty-cd-item"><div class="empty-cd-num" id="cd-hours">--</div><div class="empty-cd-unit">小时</div></div>'
    +'<div class="empty-cd-item"><div class="empty-cd-num" id="cd-mins">--</div><div class="empty-cd-unit">分</div></div>'
    +'</div>'
    +'<div class="empty-tip tip-fade" id="empty-tip">'+TIPS[0]+'</div></div>';
}
function startCountdown(){
  if(_cdInt)clearInterval(_cdInt);if(_tipInt)clearInterval(_tipInt);
  function tick(){
    const diff=WC_START-Date.now();
    const d=document.getElementById('cd-days'),h=document.getElementById('cd-hours'),m=document.getElementById('cd-mins');
    if(!d)return;
    if(diff<=0){d.textContent='0';h.textContent='0';m.textContent='0';return;}
    d.textContent=Math.floor(diff/86400000);
    h.textContent=Math.floor((diff%86400000)/3600000);
    m.textContent=Math.floor((diff%3600000)/60000);
  }
  tick();_cdInt=setInterval(tick,1000);
  _tipInt=setInterval(()=>{
    const el=document.getElementById('empty-tip');if(!el)return;
    tipIdx=(tipIdx+1)%TIPS.length;
    el.classList.remove('tip-fade');
    requestAnimationFrame(()=>{el.classList.add('tip-fade');el.textContent=TIPS[tipIdx];});
  },5000);
}

/* floating football every 8s */
setInterval(()=>{
  const fb=document.createElement('div');
  fb.className='fb-particle';fb.textContent='⚽';
  fb.style.cssText='left:'+(Math.random()*40+5)+'%;font-size:'+(16+Math.random()*16)+'px;animation-duration:'+(14+Math.random()*10)+'s;animation-delay:0s';
  document.body.appendChild(fb);setTimeout(()=>fb.remove(),26000);
},8000);

/* button press scale */
document.addEventListener('click',e=>{
  const btn=e.target.closest('button');
  if(btn&&!btn.disabled){
    btn.style.transform='scale(0.95)';
    setTimeout(()=>{btn.style.transform='';},120);
  }
});

/* ── bootstrap ── */
async function init(){
  renderProfile();
  try{
    const data=await fetch('./data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
    renderHome(data);renderPredict(data);
  }catch(e){
    document.getElementById('home-content').innerHTML=buildEmptyState();
    startCountdown();
    document.getElementById('predict-content').innerHTML='<div class="predict-empty">加载失败，请刷新重试</div>';
  }
  setTimeout(()=>{if(document.getElementById('wc-countdown'))startCountdown();},300);
}
init();
</script>
