<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 FIFA World Cup Daily · 世界杯每日晨报</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:    #070c14;
    --bg-card:    #0f1923;
    --bg-card2:   #141f2e;
    --border:     #1e2d40;
    --border-hl:  #2a3f58;
    --blue:       #3b82f6;
    --blue-dim:   #1d4ed8;
    --cyan:       #22d3ee;
    --green:      #10b981;
    --red:        #ef4444;
    --amber:      #f59e0b;
    --purple:     #a855f7;
    --text-1:     #e2eaf4;
    --text-2:     #8ba3bd;
    --text-3:     #4d6478;
    --live:       #ff4757;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-base);
    color: var(--text-1);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Header ── */
  .site-header {
    background: linear-gradient(180deg, #0a1628 0%, var(--bg-base) 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo-block { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--cyan) 100%);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; }
  .logo-title {
    font-size: 18px; font-weight: 700; letter-spacing: .4px;
    background: linear-gradient(90deg, #e2eaf4, var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo-sub { font-size: 11px; color: var(--text-3); letter-spacing: 1.5px; text-transform: uppercase; }

  .header-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .date-badge {
    background: var(--bg-card2);
    border: 1px solid var(--border-hl);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .date-badge strong { color: var(--cyan); font-weight: 600; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,71,87,.12);
    border: 1px solid rgba(255,71,87,.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--live);
    font-weight: 600;
    letter-spacing: .5px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .4; transform: scale(.75); }
  }

  /* ── Nav tabs ── */
  .nav-bar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; gap: 0;
    overflow-x: auto;
  }
  .nav-tab {
    display: flex; align-items: center; gap: 7px;
    padding: 13px 20px;
    font-size: 13px; font-weight: 500;
    color: var(--text-3);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    cursor: default;
    transition: color .2s;
  }
  .nav-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .nav-tab .emoji { font-size: 15px; }
  .count-chip {
    background: var(--blue-dim);
    color: #93c5fd;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px; font-weight: 700;
  }

  /* ── Main layout ── */
  .main {
    max-width: 1200px; margin: 0 auto;
    padding: 28px 24px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 20px;
  }
  .section-full { grid-column: 1 / -1; }

  /* ── Section card ── */
  .section-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card2);
  }
  .section-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 700; color: var(--text-1);
  }
  .section-title .icon { font-size: 17px; }
  .section-badge {
    font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: .8px;
  }
  .badge-blue  { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
  .badge-green { background: rgba(16,185,129,.15); color: #34d399; border: 1px solid rgba(16,185,129,.25); }
  .badge-amber { background: rgba(245,158,11,.15); color: #fbbf24; border: 1px solid rgba(245,158,11,.25); }
  .badge-purple{ background: rgba(168,85,247,.15); color: #c084fc; border: 1px solid rgba(168,85,247,.25); }

  .section-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

  /* ── Match row ── */
  .match-row {
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 80px 1fr auto;
    align-items: center;
    gap: 16px;
    transition: border-color .2s;
  }
  .match-row:hover { border-color: var(--border-hl); }
  .match-time-col { text-align: center; }
  .match-date-label { font-size: 10px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .match-time { font-size: 22px; font-weight: 800; color: var(--cyan); font-variant-numeric: tabular-nums; line-height: 1; }
  .match-time-unit { font-size: 10px; color: var(--text-3); margin-top: 2px; }

  .match-center { display: flex; flex-direction: column; gap: 6px; }
  .match-teams { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .team-name { font-size: 14px; font-weight: 600; color: var(--text-1); }
  .vs-sep {
    font-size: 10px; font-weight: 700; color: var(--text-3);
    letter-spacing: 1px; padding: 2px 6px;
    background: var(--bg-base);
    border-radius: 4px;
  }
  .match-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .group-tag {
    font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 4px; white-space: nowrap;
    background: rgba(34,211,238,.1); color: var(--cyan);
    border: 1px solid rgba(34,211,238,.2);
  }
  .venue-tag { font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .opener-tag {
    display: inline-block;
    font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 3px; letter-spacing: .5px;
    background: linear-gradient(90deg,rgba(245,158,11,.2),rgba(239,68,68,.2));
    color: #fbbf24; border: 1px solid rgba(245,158,11,.3);
  }

  /* ── Result row ── */
  .result-row {
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color .2s;
  }
  .result-row:hover { border-color: var(--border-hl); }
  .result-main {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .result-score {
    font-size: 26px; font-weight: 900; letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--green), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .result-detail {
    font-size: 12px; color: var(--text-2); line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .scorer-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.2);
    border-radius: 4px; padding: 1px 7px; font-size: 11px;
    color: #34d399; margin-right: 6px; margin-bottom: 4px;
  }

  /* ── Sentiment card ── */
  .sent-item {
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color .2s;
  }
  .sent-item:hover { border-color: var(--border-hl); }
  .sent-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
  .sent-title { font-size: 14px; font-weight: 600; color: var(--text-1); flex: 1; line-height: 1.4; }
  .sent-tag {
    font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 3px; white-space: nowrap; flex-shrink: 0;
    letter-spacing: .5px;
  }
  .sent-pos { background: rgba(16,185,129,.15); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
  .sent-neg { background: rgba(239,68,68,.15);  color: #f87171; border: 1px solid rgba(239,68,68,.3); }
  .sent-neu { background: rgba(148,163,184,.1);  color: #94a3b8; border: 1px solid rgba(148,163,184,.25); }
  .sent-reason { font-size: 12px; color: var(--text-2); line-height: 1.55; }
  .sent-source {
    margin-top: 9px; display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text-3);
  }
  .heat-bar-wrap { flex: 1; height: 3px; background: var(--bg-base); border-radius: 3px; }
  .heat-bar { height: 100%; border-radius: 3px; }
  .heat-high { background: linear-gradient(90deg, var(--red), var(--amber)); }
  .heat-mid  { background: linear-gradient(90deg, var(--amber), #fcd34d); }
  .heat-low  { background: linear-gradient(90deg, var(--blue), var(--cyan)); }

  /* ── AI Analysis ── */
  .ai-block {
    background: linear-gradient(135deg, rgba(59,130,246,.07) 0%, rgba(168,85,247,.07) 100%);
    border: 1px solid rgba(59,130,246,.2);
    border-radius: 10px;
    padding: 16px;
  }
  .ai-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ai-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .ai-label { font-size: 11px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; }
  .ai-model { font-size: 13px; font-weight: 600; color: var(--blue); }
  .ai-body { font-size: 13px; color: var(--text-2); line-height: 1.8; }
  .ai-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 13px; }
  .ai-tag {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: rgba(59,130,246,.1); color: #93c5fd;
    border: 1px solid rgba(59,130,246,.2);
  }
  .confidence {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(59,130,246,.15);
  }
  .conf-label { font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .conf-bar-wrap { flex: 1; height: 4px; background: var(--bg-base); border-radius: 4px; overflow: hidden; }
  .conf-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
  .conf-val { font-size: 12px; font-weight: 700; color: var(--cyan); white-space: nowrap; }

  /* ── Loading / Error ── */
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border-hl);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-center {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px; gap: 14px;
  }
  .error-msg { color: var(--red); font-size: 14px; }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 18px 24px;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-wrap: wrap;
    font-size: 11px; color: var(--text-3); letter-spacing: .3px;
  }
  footer a { color: var(--text-3); text-decoration: none; }
  footer a:hover { color: var(--text-2); }
  .footer-sep { width: 1px; height: 10px; background: var(--border); }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; padding: 16px 14px 40px; gap: 14px; }
    .section-full { grid-column: 1; }
    .match-row { grid-template-columns: 72px 1fr; }
    .match-meta { display: none; }
    .result-score { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon">⚽</div>
      <div class="logo-text">
        <span class="logo-title">2026 FIFA World Cup Daily</span>
        <span class="logo-sub">世界杯每日晨报 · AI 数据驱动</span>
      </div>
    </div>
    <div class="header-meta">
      <div class="date-badge" id="date-display">加载中…</div>
      <div class="live-badge">
        <span class="live-dot"></span>
        LIVE
      </div>
    </div>
  </div>
</header>

<!-- ── Nav ── -->
<nav class="nav-bar">
  <div class="nav-inner">
    <div class="nav-tab active">
      <span class="emoji">📅</span>今日赛程
      <span class="count-chip" id="match-count">·</span>
    </div>
    <div class="nav-tab"><span class="emoji">📊</span>昨日战报</div>
    <div class="nav-tab">
      <span class="emoji">🔥</span>热点舆情
      <span class="count-chip" id="topic-count">·</span>
    </div>
    <div class="nav-tab"><span class="emoji">🎯</span>AI 预测</div>
    <div class="nav-tab"><span class="emoji">🏆</span>积分榜</div>
  </div>
</nav>

<!-- ── Main: JS renders all sections here ── -->
<main class="main" id="app">
  <div class="section-card section-full">
    <div class="state-center">
      <div class="spinner"></div>
      <span style="color:var(--text-2);font-size:14px;letter-spacing:.3px;">正在加载晨报数据…</span>
    </div>
  </div>
</main>

<!-- ── Footer ── -->
<footer>
  <span>数据来源：football-data.org</span>
  <div class="footer-sep"></div>
  <span>舆情来源：联网搜索</span>
  <div class="footer-sep"></div>
  <span>AI 分析：Claude · Anthropic</span>
  <div class="footer-sep"></div>
  <span>每日 06:00 CST 自动更新</span>
  <div class="footer-sep"></div>
  <a href="https://niuchen476-svg.github.io/worldcup--daily/" target="_blank">worldcup-daily.github.io</a>
</footer>

<script>
  /* ── Helpers ── */
  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const flag = code => [...code.toUpperCase()]
    .map(c => String.fromCodePoint(c.charCodeAt(0) + 127397)).join('');

  function heatClass(n) {
    return n >= 80 ? 'heat-high' : n >= 55 ? 'heat-mid' : 'heat-low';
  }

  function sentClass(s) {
    return s === '正面' ? 'sent-pos' : s === '负面' ? 'sent-neg' : 'sent-neu';
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    const dt = new Date(`${dateStr}T12:00:00+08:00`);
    const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    return { display: `${y}年${m}月${d}日`, weekday: days[dt.getDay()] };
  }

  /* ── Renderers ── */
  function renderSchedule(data) {
    const [, mm, dd] = data.date.split('-');
    const label = `${mm}月${dd}日 · ${esc(data.schedule_round)}`;
    const rows = data.today_matches.map(m => `
      <div class="match-row">
        <div class="match-time-col">
          <div class="match-date-label">北京时间</div>
          <div class="match-time">${esc(m.time)}</div>
          <div class="match-time-unit">${esc(m.date)}</div>
        </div>
        <div class="match-center">
          ${m.is_opening ? `<span class="opener-tag">★ ${esc(m.tag)}</span>` : ''}
          <div class="match-teams">
            <span class="team-name">${flag(m.home_code)} ${esc(m.home)}</span>
            <span class="vs-sep">VS</span>
            <span class="team-name">${flag(m.away_code)} ${esc(m.away)}</span>
          </div>
        </div>
        <div class="match-meta">
          <span class="group-tag">${esc(m.group)}</span>
          <span class="venue-tag">📍 ${esc(m.venue)}</span>
        </div>
      </div>
    `).join('');

    return `
      <div class="section-card section-full" id="schedule">
        <div class="section-head">
          <div class="section-title"><span class="icon">📅</span> 今日赛程</div>
          <span class="section-badge badge-blue">${label}</span>
        </div>
        <div class="section-body">${rows}</div>
      </div>`;
  }

  function renderResults(data) {
    const rows = data.yesterday_matches.map(m => {
      const scorers = (m.scorers || [])
        .map(s => `<span class="scorer-tag">⚽ ${esc(s)}</span>`).join('');
      return `
        <div class="result-row">
          <div class="result-main">
            <span class="team-name">${flag(m.home_code)} ${esc(m.home)}</span>
            <span class="result-score">${m.home_score} — ${m.away_score}</span>
            <span class="team-name">${flag(m.away_code)} ${esc(m.away)}</span>
            <span class="group-tag">${esc(m.group)}</span>
          </div>
          <div class="result-detail">${scorers}${esc(m.summary)}</div>
        </div>`;
    }).join('');

    return `
      <div class="section-card" id="results">
        <div class="section-head">
          <div class="section-title"><span class="icon">📊</span> 昨日战报</div>
          <span class="section-badge badge-green">${esc(data.yesterday_label)}</span>
        </div>
        <div class="section-body">${rows}</div>
      </div>`;
  }

  function renderSentiment(data) {
    const items = data.hot_topics.map(t => `
      <div class="sent-item">
        <div class="sent-header">
          <span class="sent-title">${esc(t.title)}</span>
          <span class="sent-tag ${sentClass(t.sentiment)}">${esc(t.sentiment)}</span>
        </div>
        <div class="sent-reason">${esc(t.summary)}</div>
        <div class="sent-source">
          <span>🔥 热度</span>
          <div class="heat-bar-wrap">
            <div class="heat-bar ${heatClass(t.heat)}" style="width:${t.heat}%"></div>
          </div>
          <span>${t.heat}</span>
          <span>· ${esc(t.source)}</span>
        </div>
      </div>
    `).join('');

    return `
      <div class="section-card" id="sentiment">
        <div class="section-head">
          <div class="section-title"><span class="icon">🔥</span> 热点舆情</div>
          <span class="section-badge badge-amber">实时监控 · 联网抓取</span>
        </div>
        <div class="section-body">${items}</div>
      </div>`;
  }

  function renderAI(data) {
    const ai = data.ai_prediction;
    const [, mm, dd] = data.date.split('-');
    const tags = (ai.tags || []).map(t => `<span class="ai-tag">${esc(t)}</span>`).join('');

    return `
      <div class="section-card section-full" id="ai">
        <div class="section-head">
          <div class="section-title"><span class="icon">🎯</span> AI 预测分析</div>
          <span class="section-badge badge-purple">模型推理 · 仅供参考</span>
        </div>
        <div class="section-body">
          <div class="ai-block">
            <div class="ai-header">
              <div class="ai-icon">🤖</div>
              <div>
                <div class="ai-label">Daily Analyst · ${mm}月${dd}日晨报</div>
                <div class="ai-model">2026世界杯形势综合研判</div>
              </div>
            </div>
            <div class="ai-body">${esc(ai.text)}</div>
            ${tags ? `<div class="ai-tags">${tags}</div>` : ''}
            <div class="confidence">
              <span class="conf-label">综合置信度</span>
              <div class="conf-bar-wrap">
                <div class="conf-bar" style="width:${ai.confidence}%"></div>
              </div>
              <span class="conf-val">${ai.confidence}%</span>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ── Render all sections ── */
  function renderAll(data) {
    const { display, weekday } = formatDate(data.date);
    document.getElementById('date-display').innerHTML =
      `<strong>${esc(display)}</strong> &nbsp;${esc(weekday)} &nbsp;北京时间`;

    document.getElementById('match-count').textContent = data.today_matches.length;
    document.getElementById('topic-count').textContent = data.hot_topics.length;

    document.getElementById('app').innerHTML =
      renderSchedule(data) +
      renderResults(data) +
      renderSentiment(data) +
      renderAI(data);
  }

  /* ── Error state ── */
  function showError() {
    document.getElementById('app').innerHTML = `
      <div class="section-card section-full">
        <div class="state-center">
          <span style="font-size:28px;">⚠️</span>
          <span class="error-msg">数据加载失败，请刷新重试</span>
        </div>
      </div>`;
  }

  /* ── Bootstrap ── */
  fetch('./data.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => renderAll(data))
    .catch(() => showError());
</script>
</body>
</html>
